<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Prompt Battle — DigitalOcean</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --do-blue: #0061FF;
    --do-dark: #0B1929;
    --do-light: #E5F0FF;
    --do-accent: #00D1CA;
    --do-white: #FFFFFF;
    --do-gray: #8899A8;
    --do-red: #FF4F4F;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--do-dark);
    color: var(--do-white);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  .bg-glow {
    position: fixed;
    top: -40%;
    left: -20%;
    width: 140%;
    height: 80%;
    background: radial-gradient(ellipse at center, rgba(0,97,255,0.15) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 420px;
    margin: 0 auto;
    padding: 24px 20px;
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 28px;
  }

  .header svg { width: 40px; height: 40px; margin-bottom: 12px; }

  .header h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
    line-height: 1.2;
  }

  .header h1 span { color: var(--do-accent); }

  .header p {
    font-size: 13px;
    color: var(--do-gray);
    margin-top: 6px;
    line-height: 1.5;
  }

  /* Form */
  .form-group { margin-bottom: 14px; }

  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--do-gray);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .form-group input,
  .form-group textarea {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1.5px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 14px 16px;
    color: var(--do-white);
    font-family: 'DM Sans', sans-serif;
    font-size: 16px; /* prevents iOS zoom */
    transition: border-color 0.2s;
  }

  .form-group input:focus,
  .form-group textarea:focus {
    outline: none;
    border-color: var(--do-blue);
    background: rgba(0,97,255,0.06);
  }

  .form-group textarea {
    height: 100px;
    resize: none;
    line-height: 1.5;
  }

  .char-count {
    text-align: right;
    font-size: 11px;
    color: var(--do-gray);
    margin-top: 4px;
  }

  .submit-btn {
    width: 100%;
    padding: 16px;
    background: var(--do-blue);
    color: white;
    border: none;
    border-radius: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
    letter-spacing: 0.3px;
  }

  .submit-btn:active { transform: scale(0.97); }
  .submit-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }

  /* Result card */
  .result {
    margin-top: 24px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 20px;
    animation: slideUp 0.4s ease;
  }

  .result-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--do-accent);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
  }

  .result-tagline {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 500;
    line-height: 1.5;
    color: var(--do-white);
  }

  .result-prompt {
    margin-top: 12px;
    font-size: 12px;
    color: var(--do-gray);
    line-height: 1.4;
  }

  .try-again {
    margin-top: 16px;
    text-align: center;
  }

  .try-again button {
    background: none;
    border: 1.5px solid rgba(255,255,255,0.15);
    color: var(--do-gray);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    padding: 10px 24px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .try-again button:active {
    border-color: var(--do-blue);
    color: var(--do-white);
  }

  /* Loading */
  .loading {
    text-align: center;
    padding: 32px 0;
    animation: pulse 1.5s ease infinite;
  }

  .loading-dots span {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: var(--do-blue);
    border-radius: 50%;
    margin: 0 4px;
    animation: bounce 1.4s ease infinite;
  }

  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

  .loading p {
    font-size: 13px;
    color: var(--do-gray);
    margin-top: 12px;
  }

  /* Error */
  .error {
    background: rgba(255,79,79,0.1);
    border: 1px solid rgba(255,79,79,0.3);
    border-radius: 12px;
    padding: 14px 16px;
    margin-top: 16px;
    font-size: 13px;
    color: var(--do-red);
  }

  /* Footer */
  .footer {
    text-align: center;
    padding: 16px 20px;
    font-size: 11px;
    color: rgba(255,255,255,0.2);
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-10px); }
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }
</style>
</head>
<body>
  <div class="bg-glow"></div>

  <div class="container">
    <div class="header">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="20" fill="#0061FF"/>
        <path d="M20 9C14.48 9 10 13.48 10 19c0 4.42 2.87 8.17 6.84 9.49.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.89 1.53 2.34 1.09 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02A9.58 9.58 0 0120 14.58c.85 0 1.7.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.75c0 .27.18.58.69.48A10.01 10.01 0 0030 19c0-5.52-4.48-10-10-10z" fill="white"/>
      </svg>
      <h1>Prompt <span>Battle</span></h1>
      <p>Write one sentence. The AI turns it into a DigitalOcean tagline. Best one wins.</p>
    </div>

    <!-- Input State -->
    <div id="formState">
      <div class="form-group">
        <label>Your name</label>
        <input type="text" id="nameInput" placeholder="e.g. Jeff" maxlength="30" autocomplete="off">
      </div>

      <div class="form-group">
        <label>Your creative direction</label>
        <textarea id="promptInput" placeholder="e.g. Make it sound like a pirate captain talking about cloud infrastructure" maxlength="300"></textarea>
        <div class="char-count"><span id="charCount">0</span>/300</div>
      </div>

      <button class="submit-btn" id="submitBtn" onclick="submitPrompt()">
        Launch Prompt 🚀
      </button>
    </div>

    <!-- Loading State -->
    <div id="loadingState" style="display:none;">
      <div class="loading">
        <div class="loading-dots">
          <span></span><span></span><span></span>
        </div>
        <p>AI is generating your tagline…</p>
      </div>
    </div>

    <!-- Result State -->
    <div id="resultState" style="display:none;"></div>
  </div>

  <div class="footer">Powered by DigitalOcean Serverless Inference</div>

<script>
  const promptInput = document.getElementById('promptInput');
  const charCount = document.getElementById('charCount');
  const submitBtn = document.getElementById('submitBtn');

  promptInput.addEventListener('input', () => {
    charCount.textContent = promptInput.value.length;
  });

  async function submitPrompt() {
    const name = document.getElementById('nameInput').value.trim();
    const prompt = promptInput.value.trim();

    if (!prompt) {
      promptInput.focus();
      return;
    }

    // Show loading
    document.getElementById('formState').style.display = 'none';
    document.getElementById('loadingState').style.display = 'block';
    document.getElementById('resultState').style.display = 'none';

    try {
      const res = await fetch('/api/prompt', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name || 'Anonymous', prompt }),
      });

      const data = await res.json();

      if (!res.ok) throw new Error(data.error || 'Something went wrong');

      // Show result
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('resultState').style.display = 'block';
      document.getElementById('resultState').innerHTML = `
        <div class="result">
          <div class="result-label">AI Generated Tagline</div>
          <div class="result-tagline">${escapeHtml(data.response)}</div>
          <div class="result-prompt">Your prompt: "${escapeHtml(data.prompt)}"</div>
        </div>
        <div class="try-again">
          <button onclick="reset()">Try another prompt</button>
        </div>
      `;
    } catch (err) {
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('formState').style.display = 'block';
      document.getElementById('formState').insertAdjacentHTML(
        'beforeend',
        `<div class="error">${escapeHtml(err.message)}</div>`
      );
    }
  }

  function reset() {
    promptInput.value = '';
    charCount.textContent = '0';
    document.getElementById('formState').style.display = 'block';
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('resultState').style.display = 'none';
    // Remove old errors
    document.querySelectorAll('.error').forEach(e => e.remove());
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }
</script>
</body>
</html>
