<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Recipe Battle — DigitalOcean</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --do-blue: #0061FF;
    --do-dark: #0B1929;
    --do-accent: #00D1CA;
    --do-white: #FFFFFF;
    --do-gray: #8899A8;
    --do-red: #FF4F4F;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--do-dark);
    color: var(--do-white);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  .bg-glow {
    position: fixed;
    top: -40%;
    left: -20%;
    width: 140%;
    height: 80%;
    background: radial-gradient(ellipse at center, rgba(0,97,255,0.15) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    padding: 28px 20px 16px;
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .header {
    text-align: center;
    margin-bottom: 28px;
  }

  .header .emoji { font-size: 40px; margin-bottom: 10px; display: block; }

  .header h1 {
    font-size: clamp(20px, 5vw, 26px);
    font-weight: 700;
    letter-spacing: -0.5px;
    line-height: 1.2;
  }

  .header h1 span { color: var(--do-accent); }

  .header p {
    font-size: 14px;
    color: var(--do-gray);
    margin-top: 6px;
    line-height: 1.5;
  }

  .form-group { margin-bottom: 14px; }

  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--do-gray);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .form-group input,
  .form-group textarea {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1.5px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 14px 16px;
    color: var(--do-white);
    font-family: 'DM Sans', sans-serif;
    font-size: 16px; /* prevents iOS zoom */
    transition: border-color 0.2s;
  }

  .form-group input::placeholder,
  .form-group textarea::placeholder { color: var(--do-gray); }

  .form-group input:focus,
  .form-group textarea:focus {
    outline: none;
    border-color: var(--do-blue);
    background: rgba(0,97,255,0.06);
  }

  .form-group textarea { height: 110px; resize: none; line-height: 1.5; }

  .char-count { text-align: right; font-size: 11px; color: var(--do-gray); margin-top: 4px; }

  .submit-btn {
    width: 100%;
    padding: 16px;
    background: var(--do-blue);
    color: white;
    border: none;
    border-radius: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
  }

  .submit-btn:active { transform: scale(0.97); }
  .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .view-dishes {
    text-align: center;
    padding: 20px 0 8px;
  }

  .view-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 13px 28px;
    border: 1.5px solid rgba(0,209,202,0.4);
    border-radius: 12px;
    color: var(--do-accent);
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.2s;
    width: 100%;
    justify-content: center;
  }

  .view-btn:active { background: rgba(0,209,202,0.1); }

  /* Result */
  .result {
    margin-top: 24px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 20px;
    animation: slideUp 0.4s ease;
  }

  .result-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--do-accent);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
  }

  .result-dish {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(16px, 4vw, 20px);
    font-weight: 500;
    line-height: 1.4;
    color: var(--do-white);
  }

  .result-pref { margin-top: 12px; font-size: 12px; color: var(--do-gray); line-height: 1.4; }

  .result-img {
    margin-top: 16px;
    width: 100%;
    border-radius: 12px;
    object-fit: cover;
    max-height: 300px;
    animation: slideUp 0.4s ease;
  }

  .try-again { margin-top: 16px; text-align: center; }

  .try-again button {
    background: none;
    border: 1.5px solid rgba(255,255,255,0.15);
    color: var(--do-gray);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    padding: 10px 24px;
    border-radius: 10px;
    cursor: pointer;
  }

  /* Loading */
  .loading { text-align: center; padding: 32px 0; }

  .loading-dots span {
    display: inline-block;
    width: 8px; height: 8px;
    background: var(--do-blue);
    border-radius: 50%;
    margin: 0 4px;
    animation: bounce 1.4s ease infinite;
  }

  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
  .loading p { font-size: 13px; color: var(--do-gray); margin-top: 12px; }

  .error {
    background: rgba(255,79,79,0.1);
    border: 1px solid rgba(255,79,79,0.3);
    border-radius: 12px;
    padding: 14px 16px;
    margin-top: 16px;
    font-size: 13px;
    color: var(--do-red);
  }

  /* Footer with DO logo */
  .footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .footer img { height: 20px; width: auto; opacity: 0.5; }
  .footer span { font-size: 11px; color: rgba(255,255,255,0.2); }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-10px); }
  }
</style>
</head>
<body>
  <div class="bg-glow"></div>

  <div class="container">
    <div class="header">
      <span class="emoji">🍽️</span>
      <h1>Recipe <span>Battle</span></h1>
      <p>Tell us what you love to eat. AI conjures a dish and paints it for you.</p>
    </div>

    <div id="formState">
      <div class="form-group">
        <label>Your name</label>
        <input type="text" id="nameInput" placeholder="e.g. Jeff" maxlength="30" autocomplete="off">
      </div>

      <div class="form-group">
        <label>What do you love to eat?</label>
        <textarea id="promptInput" placeholder="e.g. Spicy noodles, crispy things, anything with miso and egg on top" maxlength="300"></textarea>
        <div class="char-count"><span id="charCount">0</span>/300</div>
      </div>

      <button class="submit-btn" id="submitBtn" onclick="submitPrompt()">
        Cook Something Up 🔥
      </button>

      <div class="view-dishes">
        <a href="/display" class="view-btn">🍽️ See All Dishes &amp; Vote</a>
      </div>
    </div>

    <div id="loadingState" style="display:none;">
      <div class="loading">
        <div class="loading-dots"><span></span><span></span><span></span></div>
        <p id="loadingMsg">Chef is thinking…</p>
      </div>
    </div>

    <div id="resultState" style="display:none;"></div>
  </div>

  <div class="footer">
    <img src="/do-logo.png" alt="DigitalOcean">
    <span>Powered by DigitalOcean AI Inference</span>
  </div>

<script>
  const promptInput = document.getElementById('promptInput');
  const charCount = document.getElementById('charCount');

  promptInput.addEventListener('input', () => {
    charCount.textContent = promptInput.value.length;
  });

  async function submitPrompt() {
    const name = document.getElementById('nameInput').value.trim();
    const preferences = promptInput.value.trim();
    if (!preferences) { promptInput.focus(); return; }

    document.getElementById('formState').style.display = 'none';
    document.getElementById('loadingState').style.display = 'block';
    document.getElementById('resultState').style.display = 'none';
    document.getElementById('loadingMsg').textContent = 'Chef is thinking…';

    try {
      const res = await fetch('/api/prompt', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name || 'Anonymous', preferences }),
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Something went wrong');

      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('resultState').style.display = 'block';

      const imgHtml = data.imageUrl
        ? `<img class="result-img" src="${escapeAttr(data.imageUrl)}" alt="${escapeHtml(data.dishName)}">`
        : '';

      document.getElementById('resultState').innerHTML = `
        <div class="result">
          <div class="result-label">✨ Your dish</div>
          <div class="result-dish">${escapeHtml(data.dishName)}</div>
          <div class="result-pref">Based on: "${escapeHtml(data.preferences)}"</div>
          ${imgHtml}
        </div>
        <div class="view-dishes" style="padding-top:16px">
          <a href="/display" class="view-btn">🍽️ See All Dishes &amp; Vote</a>
        </div>
        <div class="try-again"><button onclick="reset()">Try another</button></div>
      `;
    } catch (err) {
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('formState').style.display = 'block';
      document.querySelectorAll('.error').forEach(e => e.remove());
      document.getElementById('formState').insertAdjacentHTML(
        'beforeend',
        `<div class="error">${escapeHtml(err.message)}</div>`
      );
    }
  }

  function reset() {
    promptInput.value = '';
    charCount.textContent = '0';
    document.getElementById('formState').style.display = 'block';
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('resultState').style.display = 'none';
    document.querySelectorAll('.error').forEach(e => e.remove());
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text || '';
    return div.innerHTML;
  }

  function escapeAttr(text) {
    return (text || '').replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
