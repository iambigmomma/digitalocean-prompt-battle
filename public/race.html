<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Deploy Race — DigitalOcean</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --do-blue: #0061FF;
    --do-dark: #0B1929;
    --do-accent: #00D1CA;
    --do-white: #FFFFFF;
    --do-gray: #8899A8;
    --do-red: #FF4F4F;
    --do-green: #00C087;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--do-dark);
    color: var(--do-white);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  .bg-glow {
    position: fixed; top: -40%; left: -20%;
    width: 140%; height: 80%;
    background: radial-gradient(ellipse at center, rgba(0,97,255,0.15) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
  }

  .container {
    position: relative; z-index: 1;
    max-width: 480px; margin: 0 auto;
    padding: 28px 20px 16px;
    width: 100%; flex: 1;
    display: flex; flex-direction: column;
  }

  .header { text-align: center; margin-bottom: 28px; }
  .header .emoji { font-size: 40px; margin-bottom: 10px; display: block; }
  .header h1 {
    font-size: clamp(20px, 5vw, 26px);
    font-weight: 700; letter-spacing: -0.5px; line-height: 1.2;
  }
  .header h1 span { color: var(--do-accent); }
  .header p { font-size: 14px; color: var(--do-gray); margin-top: 6px; line-height: 1.5; }

  .steps {
    display: flex; gap: 8px; margin-bottom: 24px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px; padding: 14px 16px;
  }

  .step { flex: 1; text-align: center; }
  .step-num {
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--do-blue); color: white;
    font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 6px;
  }
  .step-text { font-size: 11px; color: var(--do-gray); line-height: 1.3; }
  .step-divider { color: rgba(255,255,255,0.15); align-self: center; font-size: 18px; }

  .form-group { margin-bottom: 14px; }
  .form-group label {
    display: block; font-size: 12px; font-weight: 500;
    color: var(--do-gray); margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }

  .form-group input {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1.5px solid rgba(255,255,255,0.1);
    border-radius: 12px; padding: 14px 16px;
    color: var(--do-white); font-family: 'DM Sans', sans-serif;
    font-size: 16px; transition: border-color 0.2s;
  }

  .form-group input::placeholder { color: var(--do-gray); }
  .form-group input:focus { outline: none; border-color: var(--do-blue); background: rgba(0,97,255,0.06); }

  .key-wrapper { position: relative; }
  .key-wrapper input { padding-right: 48px; font-family: 'JetBrains Mono', monospace; font-size: 14px; }
  .toggle-eye {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer;
    color: var(--do-gray); font-size: 18px; padding: 4px;
    transition: color 0.2s;
  }
  .toggle-eye:hover { color: var(--do-white); }

  .submit-btn {
    width: 100%; padding: 16px;
    background: var(--do-blue); color: white; border: none;
    border-radius: 12px; font-family: 'DM Sans', sans-serif;
    font-size: 16px; font-weight: 700; cursor: pointer;
    transition: all 0.2s; margin-top: 8px;
  }
  .submit-btn:active { transform: scale(0.97); }
  .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* Loading */
  .loading { text-align: center; padding: 40px 0; }
  .loading-dots span {
    display: inline-block; width: 8px; height: 8px;
    background: var(--do-blue); border-radius: 50%;
    margin: 0 4px; animation: bounce 1.4s ease infinite;
  }
  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
  .loading p { font-size: 13px; color: var(--do-gray); margin-top: 12px; }

  /* Success */
  .success-card {
    background: rgba(0,192,135,0.08);
    border: 1.5px solid rgba(0,192,135,0.3);
    border-radius: 16px; padding: 24px 20px;
    text-align: center; animation: slideUp 0.4s ease;
  }

  .position-badge {
    font-size: 56px; margin-bottom: 8px; display: block;
    animation: popIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .position-text {
    font-size: 22px; font-weight: 800; color: var(--do-white);
    margin-bottom: 4px;
  }

  .winner-name { font-size: 16px; color: var(--do-accent); font-weight: 600; margin-bottom: 16px; }

  .ai-response {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px; color: var(--do-white);
    background: rgba(255,255,255,0.06);
    border-radius: 10px; padding: 12px 14px;
    line-height: 1.5; text-align: left;
  }

  .ai-label { font-size: 10px; color: var(--do-gray); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }

  /* Error */
  .error {
    background: rgba(255,79,79,0.1);
    border: 1px solid rgba(255,79,79,0.3);
    border-radius: 12px; padding: 14px 16px;
    margin-top: 12px; font-size: 13px; color: var(--do-red);
    line-height: 1.5;
  }

  /* Already done banner */
  .done-banner {
    background: rgba(0,192,135,0.08);
    border: 1px solid rgba(0,192,135,0.25);
    border-radius: 12px; padding: 16px;
    text-align: center; margin-top: 8px;
    font-size: 14px; color: var(--do-green);
  }

  /* Confetti */
  .confetti-container {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 100;
    overflow: hidden;
  }

  .confetti-piece {
    position: absolute; top: -10px;
    width: 8px; height: 8px;
    border-radius: 2px;
    animation: confettiFall linear forwards;
  }

  /* Footer */
  .footer {
    position: relative; z-index: 1;
    text-align: center; padding: 20px;
    display: flex; flex-direction: column;
    align-items: center; gap: 6px;
  }
  .footer img { height: 20px; width: auto; opacity: 0.5; }
  .footer span { font-size: 11px; color: rgba(255,255,255,0.2); }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes popIn {
    from { transform: scale(0.3); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-10px); }
  }

  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="confetti-container" id="confettiContainer"></div>

<div class="container">
  <div class="header">
    <span class="emoji">🏁</span>
    <h1>Deploy <span>Race</span></h1>
    <p>Create your DO account, generate a Model Access Key, and verify your endpoint. First 3 win prizes!</p>
  </div>

  <div class="steps">
    <div class="step">
      <div class="step-num">1</div>
      <div class="step-text">Create DO account</div>
    </div>
    <div class="step-divider">›</div>
    <div class="step">
      <div class="step-num">2</div>
      <div class="step-text">Get Model Access Key</div>
    </div>
    <div class="step-divider">›</div>
    <div class="step">
      <div class="step-num">3</div>
      <div class="step-text">Paste it here & verify</div>
    </div>
  </div>

  <div id="formState">
    <div class="form-group">
      <label>Your name</label>
      <input type="text" id="nameInput" placeholder="e.g. Jeff" maxlength="30" autocomplete="off">
    </div>

    <div class="form-group">
      <label>Model Access Key</label>
      <div class="key-wrapper">
        <input type="password" id="keyInput" placeholder="Paste your Model Access Key" autocomplete="off" autocorrect="off" spellcheck="false">
        <button class="toggle-eye" onclick="toggleKey()" id="eyeBtn" aria-label="Show/hide key">👁</button>
      </div>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="verify()">
      Verify My Endpoint 🏁
    </button>
    <div id="errorBox"></div>
  </div>

  <div id="loadingState" style="display:none">
    <div class="loading">
      <div class="loading-dots"><span></span><span></span><span></span></div>
      <p>Connecting to DigitalOcean AI…</p>
    </div>
  </div>

  <div id="successState" style="display:none"></div>
  <div id="doneState" style="display:none"></div>
</div>

<div class="footer">
  <img src="/do-logo.png" alt="DigitalOcean">
  <span>Powered by DigitalOcean AI Inference</span>
</div>

<script>
  const PRIZES = 3;

  // Check if already completed
  const savedResult = JSON.parse(localStorage.getItem('rb_race') || 'null');
  if (savedResult) showAlreadyDone(savedResult);

  function toggleKey() {
    const input = document.getElementById('keyInput');
    const btn = document.getElementById('eyeBtn');
    if (input.type === 'password') {
      input.type = 'text';
      btn.textContent = '🙈';
    } else {
      input.type = 'password';
      btn.textContent = '👁';
    }
  }

  async function verify() {
    const name = document.getElementById('nameInput').value.trim();
    const key = document.getElementById('keyInput').value.trim();

    document.getElementById('errorBox').innerHTML = '';

    if (!name) { document.getElementById('nameInput').focus(); return; }
    if (!key) { document.getElementById('keyInput').focus(); return; }

    document.getElementById('formState').style.display = 'none';
    document.getElementById('loadingState').style.display = 'block';

    try {
      const res = await fetch('/api/race', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, key }),
      });

      const data = await res.json();

      if (!res.ok) {
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('formState').style.display = 'block';
        document.getElementById('errorBox').innerHTML =
          `<div class="error">⚠️ ${escapeHtml(data.error)}</div>`;
        return;
      }

      localStorage.setItem('rb_race', JSON.stringify(data));
      document.getElementById('loadingState').style.display = 'none';
      showSuccess(data);

      if (data.position <= PRIZES) launchConfetti();

    } catch (err) {
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('formState').style.display = 'block';
      document.getElementById('errorBox').innerHTML =
        `<div class="error">⚠️ Connection error — please try again</div>`;
    }
  }

  function positionLabel(pos) {
    if (pos === 1) return { emoji: '🥇', text: '1st Place!' };
    if (pos === 2) return { emoji: '🥈', text: '2nd Place!' };
    if (pos === 3) return { emoji: '🥉', text: '3rd Place!' };
    return { emoji: '✅', text: `#${pos} — You\'re live!` };
  }

  function showSuccess(data) {
    const { emoji, text } = positionLabel(data.position);
    const box = document.getElementById('successState');
    box.style.display = 'block';
    box.innerHTML = `
      <div class="success-card">
        <span class="position-badge">${emoji}</span>
        <div class="position-text">${text}</div>
        <div class="winner-name">${escapeHtml(data.name)}</div>
        <div class="ai-label">AI Response</div>
        <div class="ai-response">${escapeHtml(data.response)}</div>
      </div>`;
  }

  function showAlreadyDone(data) {
    document.getElementById('formState').style.display = 'none';
    const { emoji, text } = positionLabel(data.position);
    const box = document.getElementById('doneState');
    box.style.display = 'block';
    box.innerHTML = `
      <div class="done-banner">
        ${emoji} You already verified! <strong>${text}</strong>
      </div>
      <div style="margin-top:16px">`;
    // Re-show the result card too
    showSuccess(data);
  }

  // Confetti
  function launchConfetti() {
    const container = document.getElementById('confettiContainer');
    const colors = ['#0061FF','#00D1CA','#FFD233','#FF4F7B','#00C087','#FF4F4F'];
    for (let i = 0; i < 80; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = Math.random() * 100 + 'vw';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.width = (6 + Math.random() * 8) + 'px';
      piece.style.height = (6 + Math.random() * 8) + 'px';
      piece.style.animationDuration = (1.5 + Math.random() * 2) + 's';
      piece.style.animationDelay = (Math.random() * 0.8) + 's';
      container.appendChild(piece);
      piece.addEventListener('animationend', () => piece.remove());
    }
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text || '';
    return div.innerHTML;
  }
</script>
</body>
</html>
