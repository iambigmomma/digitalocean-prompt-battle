<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe Battle — Live Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --do-blue: #0061FF;
    --do-dark: #070F1A;
    --do-accent: #00D1CA;
    --do-white: #FFFFFF;
    --do-gray: #6B7D8E;
    --do-card: rgba(255,255,255,0.04);
    --do-border: rgba(255,255,255,0.06);
    --do-star: #FFD233;
    --do-heart: #FF4F7B;
    --do-green: #00C087;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--do-dark);
    color: var(--do-white);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  .bg-grid {
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(0,97,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,97,255,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }

  .bg-glow-top {
    position: fixed; top: -200px; right: -100px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(0,97,255,0.12) 0%, transparent 70%);
    pointer-events: none;
  }

  /* Layout */
  .layout {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px 24px 12px;
    min-height: 0;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    flex-shrink: 0;
    gap: 12px;
    flex-wrap: wrap;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .header-left h1 {
    font-size: clamp(18px, 3vw, 26px);
    font-weight: 800;
    letter-spacing: -0.5px;
    white-space: nowrap;
  }

  .header-left h1 span { color: var(--do-accent); }

  .live-badge {
    display: flex; align-items: center; gap: 6px;
    background: rgba(255,79,79,0.15);
    padding: 5px 12px; border-radius: 20px;
    font-size: 11px; font-weight: 700; color: #FF4F4F;
    text-transform: uppercase; letter-spacing: 1px;
    white-space: nowrap;
  }

  .live-dot {
    width: 7px; height: 7px;
    background: #FF4F4F; border-radius: 50%;
    animation: blink 1.5s ease infinite;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .chef-badge {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 40px;
    padding: 5px 12px 5px 5px;
  }

  .chef-badge img {
    width: 34px; height: 34px;
    border-radius: 50%;
    object-fit: cover;
    object-position: center 20%;
    border: 2px solid var(--do-accent);
    flex-shrink: 0;
  }

  .chef-badge-text { font-size: 11px; line-height: 1.3; }
  .chef-badge-text strong { display: block; font-size: 12px; color: var(--do-white); }
  .chef-badge-text span { color: var(--do-gray); font-size: 10px; }

  .counter { font-size: 12px; color: var(--do-gray); white-space: nowrap; }
  .counter strong { color: var(--do-white); font-size: 18px; font-weight: 700; }

  .create-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 16px;
    background: var(--do-blue);
    border-radius: 10px;
    color: var(--do-white);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
    transition: opacity 0.2s;
    white-space: nowrap;
  }

  .create-btn:hover { opacity: 0.85; }
  .create-btn:active { opacity: 0.7; }

  /* Feed grid */
  .feed-scroll {
    flex: 1;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
    align-content: start;
    padding-bottom: 8px;
  }

  /* Mobile: 2 columns on small screens */
  @media (max-width: 600px) {
    .layout { padding: 14px 12px 10px; }
    .header { margin-bottom: 12px; }
    .chef-badge-text { display: none; }
    .counter { display: none; }
    .feed-scroll {
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
  }

  .feed-scroll::-webkit-scrollbar { width: 3px; }
  .feed-scroll::-webkit-scrollbar-track { background: transparent; }
  .feed-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

  /* Card */
  .entry {
    background: var(--do-card);
    border: 1px solid var(--do-border);
    border-radius: 14px;
    overflow: hidden;
    animation: cardIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    transition: border-color 0.3s;
    display: flex;
    flex-direction: column;
  }

  .entry.starred { border-color: var(--do-star); }

  .card-image {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
  }

  .card-placeholder {
    width: 100%;
    aspect-ratio: 1 / 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: rgba(255,255,255,0.03);
    color: var(--do-gray);
    font-size: 12px;
    padding: 12px;
  }

  .card-placeholder .spinner {
    width: 22px; height: 22px;
    border: 2px solid rgba(255,255,255,0.1);
    border-top-color: var(--do-blue);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  .card-placeholder .dish-preview {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--do-white);
    text-align: center;
    line-height: 1.4;
  }

  .card-footer {
    padding: 10px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    border-top: 1px solid var(--do-border);
  }

  .card-info { min-width: 0; flex: 1; }

  .card-dish {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(11px, 1.5vw, 13px);
    font-weight: 500;
    color: var(--do-white);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-name {
    font-size: 11px;
    color: var(--do-gray);
    margin-top: 2px;
    transition: filter 0.4s ease;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-name.blurred { filter: blur(5px); user-select: none; }

  .vote-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    background: rgba(255,79,123,0.12);
    border: 1px solid rgba(255,79,123,0.2);
    border-radius: 20px;
    padding: 6px 10px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--do-heart);
    transition: all 0.15s;
    flex-shrink: 0;
    min-width: 52px;
    justify-content: center;
  }

  .vote-btn:active { transform: scale(0.92); }
  .vote-btn.voted { background: rgba(255,79,123,0.25); border-color: var(--do-heart); }

  /* Empty state */
  .empty {
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--do-gray);
    gap: 12px;
    padding: 60px 0;
  }

  .empty-icon { font-size: 40px; opacity: 0.3; }
  .empty p { font-size: 16px; }

  /* Footer */
  .footer {
    position: relative;
    z-index: 1;
    padding: 10px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .footer img { height: 18px; width: auto; opacity: 0.35; }

  /* Tabs */
  .tab-bar {
    display: flex; gap: 6px;
    margin-bottom: 14px; flex-shrink: 0;
  }

  .tab-btn {
    flex: 1; padding: 9px 16px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    color: var(--do-gray); font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 700; cursor: pointer;
    transition: all 0.2s; white-space: nowrap;
  }

  .tab-btn.active {
    background: var(--do-blue);
    border-color: var(--do-blue);
    color: var(--do-white);
  }

  /* Race leaderboard */
  .race-section { flex: 1; display: none; flex-direction: column; min-height: 0; overflow-y: auto; }
  .race-section.visible { display: flex; }

  .prize-counter {
    text-align: center; margin-bottom: 20px; flex-shrink: 0;
  }

  .prize-counter .prize-num {
    font-size: clamp(48px, 10vw, 80px);
    font-weight: 800; line-height: 1;
    color: var(--do-accent);
  }

  .prize-counter .prize-label {
    font-size: 14px; color: var(--do-gray); margin-top: 4px;
  }

  .prize-counter .prize-bar {
    display: flex; justify-content: center; gap: 10px; margin-top: 12px;
  }

  .prize-slot {
    width: 48px; height: 6px; border-radius: 3px;
    background: rgba(255,255,255,0.1); transition: background 0.5s;
  }

  .prize-slot.filled { background: var(--do-accent); }

  .race-cards {
    display: flex; flex-direction: column; gap: 12px;
    flex: 1; overflow-y: auto; padding-bottom: 8px;
  }

  .race-card {
    display: flex; align-items: center; gap: 16px;
    background: var(--do-card);
    border: 1px solid var(--do-border);
    border-radius: 14px; padding: 16px 20px;
    animation: cardIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    transition: border-color 0.3s;
  }

  .race-card.pos-1 { border-color: #FFD233; background: rgba(255,210,51,0.04); }
  .race-card.pos-2 { border-color: #C0C0C0; background: rgba(192,192,192,0.04); }
  .race-card.pos-3 { border-color: #CD7F32; background: rgba(205,127,50,0.04); }

  .race-medal { font-size: 36px; flex-shrink: 0; }

  .race-info { flex: 1; min-width: 0; }
  .race-name { font-size: 18px; font-weight: 700; color: var(--do-white); }
  .race-response {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; color: var(--do-gray);
    margin-top: 3px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }

  .race-time { font-size: 11px; color: var(--do-gray); flex-shrink: 0; }

  .race-empty {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: var(--do-gray); gap: 12px; padding: 40px 0;
  }

  .race-empty .empty-icon { font-size: 40px; opacity: 0.3; }
  .race-empty p { font-size: 16px; }

  /* QR section */
  .qr-section {
    text-align: center; padding: 16px; flex-shrink: 0;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px; margin-top: 12px;
  }

  .qr-section img { width: 140px; height: 140px; border-radius: 8px; }
  .qr-label { font-size: 12px; color: var(--do-gray); margin-top: 8px; }
  .qr-url { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--do-accent); margin-top: 2px; }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(16px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow-top"></div>

  <div class="layout">
    <div class="header">
      <div class="header-left">
        <h1>🍽️ Recipe <span>Battle</span></h1>
        <div class="live-badge"><div class="live-dot"></div> Live</div>
        <div class="chef-badge">
          <img src="/gordon.jpg" alt="Gordon Ramsay"
            onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
          <span style="display:none;font-size:26px">👨‍🍳</span>
          <div class="chef-badge-text">
            <strong>Gordon Ramsay</strong>
            <span>Head Chef &amp; Judge</span>
          </div>
        </div>
      </div>
      <div class="header-right">
        <div class="counter"><strong id="entryCount">0</strong> dishes</div>
      </div>
    </div>

    <!-- Tab bar -->
    <div class="tab-bar">
      <button class="tab-btn active" id="tabPrompt" onclick="switchTab('prompt')">🍽️ Recipe Battle</button>
      <button class="tab-btn" id="tabRace" onclick="switchTab('race')">🏁 Deploy Race</button>
    </div>

    <!-- Round 1: Recipe Battle -->
    <div id="promptSection" style="flex:1;display:flex;flex-direction:column;min-height:0">
      <div class="feed-scroll" id="feed"></div>
    </div>

    <!-- Round 2: Deploy Race -->
    <div class="race-section" id="raceSection">
      <div class="prize-counter">
        <div class="prize-num" id="prizeNum">0</div>
        <div class="prize-label">/ 3 prizes claimed</div>
        <div class="prize-bar">
          <div class="prize-slot" id="slot1"></div>
          <div class="prize-slot" id="slot2"></div>
          <div class="prize-slot" id="slot3"></div>
        </div>
      </div>

      <div class="race-cards" id="raceCards">
        <div class="race-empty">
          <div class="empty-icon">🏁</div>
          <p>Waiting for finishers…</p>
        </div>
      </div>

      <div class="qr-section">
        <img id="qrCode" src="" alt="QR Code">
        <div class="qr-label">Scan to join Round 2</div>
        <div class="qr-url" id="qrUrl"></div>
      </div>
    </div>
  </div>

  <div class="footer">
    <a href="/" class="create-btn">🔥 Create a Dish</a>
    <img src="/do-logo.png" alt="DigitalOcean">
  </div>

<script>
  const feed = document.getElementById('feed');
  const entryCount = document.getElementById('entryCount');
  let entries = [];
  let namesRevealed = false;
  let raceResults = [];
  const PRIZES = 3;

  const voted = new Set(JSON.parse(localStorage.getItem('rb_voted') || '[]'));

  // -------------------------------------------------------
  // Tab switching
  // -------------------------------------------------------
  function switchTab(tab) {
    document.getElementById('promptSection').style.display = tab === 'prompt' ? 'flex' : 'none';
    document.getElementById('raceSection').classList.toggle('visible', tab === 'race');
    document.getElementById('tabPrompt').classList.toggle('active', tab === 'prompt');
    document.getElementById('tabRace').classList.toggle('active', tab === 'race');
  }

  // Set up QR code on load
  (function setupQR() {
    const raceUrl = window.location.origin + '/race';
    document.getElementById('qrUrl').textContent = raceUrl;
    document.getElementById('qrCode').src =
      `https://api.qrserver.com/v1/create-qr-code/?size=200x200&color=00D1CA&bgcolor=070F1A&data=${encodeURIComponent(raceUrl)}`;
  })();

  function render() {
    entryCount.textContent = entries.length;

    if (entries.length === 0) {
      feed.innerHTML = `
        <div class="empty">
          <div class="empty-icon">🍴</div>
          <p>Waiting for dishes…</p>
        </div>`;
      return;
    }

    entries.forEach(entry => {
      const existing = feed.querySelector(`[data-id="${entry.id}"]`);
      if (existing) {
        updateCard(existing, entry);
      } else {
        feed.querySelector('.empty')?.remove();
        feed.appendChild(createCard(entry));
      }
    });
  }

  function createCard(entry) {
    const div = document.createElement('div');
    div.className = `entry${entry.starred ? ' starred' : ''}`;
    div.dataset.id = entry.id;
    div.innerHTML = cardHTML(entry);
    return div;
  }

  function updateCard(el, entry) {
    el.className = `entry${entry.starred ? ' starred' : ''}`;
    el.innerHTML = cardHTML(entry);
  }

  function cardHTML(entry) {
    let imageArea;
    if (entry.imageUrl) {
      imageArea = `<img class="card-image" src="${escapeAttr(entry.imageUrl)}" alt="${escapeHtml(entry.dishName)}">`;
    } else if (entry.dishName) {
      imageArea = `
        <div class="card-placeholder">
          <div class="spinner"></div>
          <div class="dish-preview">${escapeHtml(entry.dishName)}</div>
          <div style="font-size:10px">Painting your dish…</div>
        </div>`;
    } else {
      imageArea = `
        <div class="card-placeholder">
          <div class="spinner"></div>
          <div style="font-size:10px">Chef is thinking…</div>
        </div>`;
    }

    const hasVoted = voted.has(entry.id);
    return `
      ${imageArea}
      <div class="card-footer">
        <div class="card-info">
          <div class="card-dish">${escapeHtml(entry.dishName || '…')}</div>
          <div class="card-name${namesRevealed ? '' : ' blurred'}">${escapeHtml(entry.name)}</div>
        </div>
        <button class="vote-btn${hasVoted ? ' voted' : ''}" onclick="vote(${entry.id})">
          ${hasVoted ? '❤️' : '🤍'} ${entry.votes}
        </button>
      </div>`;
  }

  const evtSource = new EventSource('/api/stream');

  evtSource.addEventListener('new_prompt', (e) => { entries.push(JSON.parse(e.data)); render(); });
  evtSource.addEventListener('dish_ready', patch);
  evtSource.addEventListener('response_ready', patch);
  evtSource.addEventListener('vote_update', patch);
  evtSource.addEventListener('star_toggle', patch);

  evtSource.addEventListener('reveal_toggle', (e) => {
    namesRevealed = JSON.parse(e.data).namesRevealed;
    render();
  });

  evtSource.addEventListener('reset', () => {
    entries = []; namesRevealed = false; raceResults = [];
    voted.clear(); localStorage.setItem('rb_voted', '[]');
    render(); renderRace();
  });

  evtSource.addEventListener('race_finish', (e) => {
    const result = JSON.parse(e.data);
    raceResults.push(result);
    renderRace();
    playFinishSound();
  });

  function patch(e) {
    const updated = JSON.parse(e.data);
    const idx = entries.findIndex(x => x.id === updated.id);
    if (idx !== -1) entries[idx] = updated;
    render();
  }

  fetch('/api/entries')
    .then(r => r.json())
    .then(data => {
      entries = data.entries || [];
      namesRevealed = data.namesRevealed || false;
      render();
    });

  fetch('/api/race-results')
    .then(r => r.json())
    .then(data => { raceResults = data || []; renderRace(); });

  function vote(id) {
    if (voted.has(id)) return;
    voted.add(id);
    localStorage.setItem('rb_voted', JSON.stringify([...voted]));
    fetch(`/api/vote/${id}`, { method: 'POST' });
    const entry = entries.find(e => e.id === id);
    if (entry) { entry.votes += 1; render(); }
  }

  // -------------------------------------------------------
  // Race leaderboard render
  // -------------------------------------------------------
  function renderRace() {
    const claimed = Math.min(raceResults.length, PRIZES);
    document.getElementById('prizeNum').textContent = claimed;
    for (let i = 1; i <= PRIZES; i++) {
      document.getElementById(`slot${i}`).classList.toggle('filled', i <= claimed);
    }

    const container = document.getElementById('raceCards');
    if (raceResults.length === 0) {
      container.innerHTML = `
        <div class="race-empty">
          <div class="empty-icon">🏁</div>
          <p>Waiting for finishers…</p>
        </div>`;
      return;
    }

    raceResults.forEach(result => {
      if (container.querySelector(`[data-race-id="${result.id}"]`)) return;
      container.querySelector('.race-empty')?.remove();

      const medals = ['','🥇','🥈','🥉'];
      const medal = medals[result.position] || '✅';
      const posClass = result.position <= 3 ? `pos-${result.position}` : '';
      const time = new Date(result.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      const card = document.createElement('div');
      card.className = `race-card ${posClass}`;
      card.dataset.raceId = result.id;
      card.innerHTML = `
        <div class="race-medal">${medal}</div>
        <div class="race-info">
          <div class="race-name">${escapeHtml(result.name)}</div>
          <div class="race-response">${escapeHtml(result.response)}</div>
        </div>
        <div class="race-time">${time}</div>`;
      container.appendChild(card);
    });
  }

  function playFinishSound() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [523, 659, 784].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = freq;
        osc.type = 'sine';
        const t = ctx.currentTime + i * 0.15;
        gain.gain.setValueAtTime(0.25, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
        osc.start(t); osc.stop(t + 0.3);
      });
    } catch (e) {}
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text || '';
    return div.innerHTML;
  }

  function escapeAttr(text) { return (text || '').replace(/"/g, '&quot;'); }
</script>
</body>
</html>
