<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe Battle — Live Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --do-blue: #0061FF;
    --do-dark: #070F1A;
    --do-accent: #00D1CA;
    --do-white: #FFFFFF;
    --do-gray: #6B7D8E;
    --do-card: rgba(255,255,255,0.04);
    --do-border: rgba(255,255,255,0.06);
    --do-star: #FFD233;
    --do-heart: #FF4F7B;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--do-dark);
    color: var(--do-white);
    min-height: 100vh;
    overflow: hidden;
  }

  .bg-grid {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,97,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,97,255,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }

  .bg-glow-top {
    position: fixed; top: -200px; right: -100px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(0,97,255,0.12) 0%, transparent 70%);
    pointer-events: none;
  }

  .layout {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 24px 32px;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-shrink: 0;
  }

  .header-left { display: flex; align-items: center; gap: 14px; }

  .header-left h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
  .header-left h1 span { color: var(--do-accent); }

  .live-badge {
    display: flex; align-items: center; gap: 6px;
    background: rgba(255,79,79,0.15);
    padding: 5px 12px; border-radius: 20px;
    font-size: 11px; font-weight: 700; color: #FF4F4F;
    text-transform: uppercase; letter-spacing: 1px;
  }

  .live-dot {
    width: 7px; height: 7px;
    background: #FF4F4F; border-radius: 50%;
    animation: blink 1.5s ease infinite;
  }

  .counter { font-size: 13px; color: var(--do-gray); }
  .counter strong { color: var(--do-white); font-size: 20px; font-weight: 700; }

  /* Grid */
  .feed-scroll {
    flex: 1;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
    align-content: start;
    padding-right: 8px;
  }

  .feed-scroll::-webkit-scrollbar { width: 4px; }
  .feed-scroll::-webkit-scrollbar-track { background: transparent; }
  .feed-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

  /* Card */
  .entry {
    background: var(--do-card);
    border: 1px solid var(--do-border);
    border-radius: 16px;
    overflow: hidden;
    animation: cardIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    transition: border-color 0.3s;
    display: flex;
    flex-direction: column;
  }

  .entry.starred { border-color: var(--do-star); }

  /* Image area */
  .card-image {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
    background: rgba(255,255,255,0.04);
  }

  .card-placeholder {
    width: 100%;
    aspect-ratio: 1 / 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(255,255,255,0.03);
    color: var(--do-gray);
    font-size: 13px;
  }

  .card-placeholder .spinner {
    width: 24px; height: 24px;
    border: 2px solid rgba(255,255,255,0.1);
    border-top-color: var(--do-blue);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  .card-placeholder .dish-preview {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--do-white);
    text-align: center;
    padding: 0 16px;
    line-height: 1.4;
  }

  .card-placeholder .food-emoji { font-size: 48px; }

  /* Card footer */
  .card-footer {
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    border-top: 1px solid var(--do-border);
  }

  .card-info { min-width: 0; flex: 1; }

  .card-dish {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    color: var(--do-white);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-name {
    font-size: 11px;
    color: var(--do-gray);
    margin-top: 2px;
    transition: filter 0.4s ease;
  }

  .card-name.blurred { filter: blur(6px); user-select: none; }

  /* Vote button */
  .vote-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(255,79,123,0.12);
    border: 1px solid rgba(255,79,123,0.2);
    border-radius: 20px;
    padding: 6px 12px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--do-heart);
    transition: all 0.15s;
    flex-shrink: 0;
  }

  .vote-btn:hover { background: rgba(255,79,123,0.22); transform: scale(1.05); }
  .vote-btn:active { transform: scale(0.95); }
  .vote-btn.voted { background: rgba(255,79,123,0.25); border-color: var(--do-heart); }

  .vote-btn .heart { font-size: 15px; }

  /* Empty state */
  .empty {
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--do-gray);
    gap: 12px;
    padding: 80px 0;
  }

  .empty-icon { font-size: 48px; opacity: 0.3; }
  .empty p { font-size: 18px; }

  /* Admin bar */
  .chef-badge {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 40px;
    padding: 6px 14px 6px 6px;
  }

  .chef-badge img {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
    object-position: center 20%;
    border: 2px solid var(--do-accent);
  }

  .chef-badge-text { font-size: 12px; line-height: 1.3; }
  .chef-badge-text strong { display: block; font-size: 13px; color: var(--do-white); }
  .chef-badge-text span { color: var(--do-gray); font-size: 11px; }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(20px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow-top"></div>

  <div class="layout">
    <div class="header">
      <div class="header-left">
        <h1>🍽️ Recipe <span>Battle</span></h1>
        <div class="live-badge"><div class="live-dot"></div> Live</div>
      </div>
      <div style="display:flex;align-items:center;gap:16px">
        <div class="chef-badge">
          <img src="/gordon.jpg" alt="Gordon Ramsay" onerror="this.style.display='none';this.nextSibling.style.display='block'">
          <span style="display:none;font-size:28px">👨‍🍳</span>
          <div class="chef-badge-text">
            <strong>Gordon Ramsay</strong>
            <span>Head Chef &amp; Judge</span>
          </div>
        </div>
        <div class="counter">
          <strong id="entryCount">0</strong> dishes
        </div>
      </div>
    </div>

    <div class="feed-scroll" id="feed"></div>
  </div>


<script>
  const feed = document.getElementById('feed');
  const entryCount = document.getElementById('entryCount');
  let entries = [];
  let namesRevealed = false;

  // Track voted entries per session
  const voted = new Set(JSON.parse(localStorage.getItem('rb_voted') || '[]'));

  // -------------------------------------------------------
  // Render
  // -------------------------------------------------------
  function render() {
    entryCount.textContent = entries.length;

    if (entries.length === 0) {
      feed.innerHTML = `
        <div class="empty">
          <div class="empty-icon">🍴</div>
          <p>Waiting for dishes…</p>
        </div>`;
      return;
    }

    entries.forEach(entry => {
      const existing = feed.querySelector(`[data-id="${entry.id}"]`);
      if (existing) {
        updateCard(existing, entry);
      } else {
        const empty = feed.querySelector('.empty');
        if (empty) empty.remove();
        feed.appendChild(createCard(entry));
      }
    });
  }

  function createCard(entry) {
    const div = document.createElement('div');
    div.className = `entry${entry.starred ? ' starred' : ''}`;
    div.dataset.id = entry.id;
    div.innerHTML = cardHTML(entry);
    return div;
  }

  function updateCard(el, entry) {
    el.className = `entry${entry.starred ? ' starred' : ''}`;
    el.innerHTML = cardHTML(entry);
  }

  function cardHTML(entry) {
    let imageArea = '';
    if (entry.imageUrl) {
      imageArea = `<img class="card-image" src="${escapeAttr(entry.imageUrl)}" alt="${escapeHtml(entry.dishName)}">`;
    } else if (entry.dishName) {
      // Dish name ready but image still generating
      imageArea = `
        <div class="card-placeholder">
          <div class="spinner"></div>
          <div class="dish-preview">${escapeHtml(entry.dishName)}</div>
          <div style="font-size:11px">Painting your dish…</div>
        </div>`;
    } else {
      // Nothing ready yet
      imageArea = `
        <div class="card-placeholder">
          <div class="spinner"></div>
          <div style="font-size:11px">Chef is thinking…</div>
        </div>`;
    }

    const hasVoted = voted.has(entry.id);
    const nameClass = namesRevealed ? 'card-name' : 'card-name blurred';
    const dishLabel = entry.dishName || '…';

    return `
      ${imageArea}
      <div class="card-footer">
        <div class="card-info">
          <div class="card-dish">${escapeHtml(dishLabel)}</div>
          <div class="${nameClass}">${escapeHtml(entry.name)}</div>
        </div>
        <button class="vote-btn${hasVoted ? ' voted' : ''}" onclick="vote(${entry.id})">
          <span class="heart">${hasVoted ? '❤️' : '🤍'}</span>
          <span>${entry.votes}</span>
        </button>
      </div>
    `;
  }

  // -------------------------------------------------------
  // SSE
  // -------------------------------------------------------
  const evtSource = new EventSource('/api/stream');

  evtSource.addEventListener('new_prompt', (e) => {
    entries.push(JSON.parse(e.data));
    render();
  });

  evtSource.addEventListener('dish_ready', (e) => {
    const updated = JSON.parse(e.data);
    const idx = entries.findIndex(x => x.id === updated.id);
    if (idx !== -1) entries[idx] = updated;
    render();
  });

  evtSource.addEventListener('response_ready', (e) => {
    const updated = JSON.parse(e.data);
    const idx = entries.findIndex(x => x.id === updated.id);
    if (idx !== -1) entries[idx] = updated;
    render();
  });

  evtSource.addEventListener('vote_update', (e) => {
    const updated = JSON.parse(e.data);
    const idx = entries.findIndex(x => x.id === updated.id);
    if (idx !== -1) entries[idx] = updated;
    render();
  });

  evtSource.addEventListener('star_toggle', (e) => {
    const updated = JSON.parse(e.data);
    const idx = entries.findIndex(x => x.id === updated.id);
    if (idx !== -1) entries[idx] = updated;
    render();
  });

  evtSource.addEventListener('reveal_toggle', (e) => {
    namesRevealed = JSON.parse(e.data).namesRevealed;
    render();
  });

  evtSource.addEventListener('reset', () => {
    entries = [];
    namesRevealed = false;
    voted.clear();
    localStorage.setItem('rb_voted', '[]');
    updateRevealBtn();
    render();
  });

  // -------------------------------------------------------
  // Initial load
  // -------------------------------------------------------
  fetch('/api/entries')
    .then(r => r.json())
    .then(data => {
      entries = data.entries || [];
      namesRevealed = data.namesRevealed || false;
      render();
    });

  // -------------------------------------------------------
  // Voting
  // -------------------------------------------------------
  function vote(id) {
    if (voted.has(id)) return;
    voted.add(id);
    localStorage.setItem('rb_voted', JSON.stringify([...voted]));
    fetch(`/api/vote/${id}`, { method: 'POST' });
    // Optimistically update
    const entry = entries.find(e => e.id === id);
    if (entry) { entry.votes += 1; render(); }
  }


  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text || '';
    return div.innerHTML;
  }

  function escapeAttr(text) {
    return (text || '').replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
